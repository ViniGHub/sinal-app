         iPhones; without it the control bar sits under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0f13" />
    <meta
      name="description"
      content="Sinal — conversa por voz e compartilhamento de tela ponto a ponto, direto entre os navegadores."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Sinal — voz e tela com seus amigos</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O Sinal precisa de JavaScript para estabelecer as chamadas.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body> 
</html>
