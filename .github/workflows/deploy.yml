name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Runs the checks on the branch *before* it reaches main. Without this the
  # gate is decorative: verify would only fail once main was already broken.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by branch so a pull request never cancels the deploy of another.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Runners have retired the Node 20 action runtime; every action below is
  # pinned to a major that ships on node24.
  NODE_VERSION: "24"

jobs:
  # Type errors and failing tests should stop a deploy, not ship with it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Two browsers meeting each other, which is the only place the failures that
  # actually reached production could ever have been caught.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Only Chromium: the fake-media flags these tests rely on are its own,
      # and downloading the other engines would cost minutes for nothing.
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        # Kept only when something failed — the report carries traces and video
        # of the run, which is what makes a flaky handshake diagnosable.
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Deliberately not gated on `e2e`. Those tests drive real WebRTC through
    # the public PeerJS broker — a third party we do not control — and letting
    # its bad day block a fix from shipping is worse than the protection is
    # worth. They still run, and still show red, on every push and pull
    # request. Gate on them once they run against a broker we own.
    needs: [verify]
    # A pull request should be checked, never published.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        env:
          # Project pages live at /<repo>/, so the bundle needs a matching base.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Endpoint that mints short-lived TURN credentials. A plain URL, so a
          # repository variable is the right home for it — the secret it guards
          # never leaves the Worker.
          VITE_TURN_ENDPOINT: ${{ vars.TURN_ENDPOINT }}
          # Legacy fallback for a self-hosted TURN with fixed credentials. Using
          # secrets keeps these out of the repository — it does NOT keep them out
          # of the shipped bundle, which anyone can read.
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
