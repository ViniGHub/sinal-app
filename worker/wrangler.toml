name = "sinal-turn"
main = "index.js"
compatibility_date = "2026-01-01"

# Origins allowed to ask for credentials. Not authentication — see the comment
# in index.js — but it keeps the endpoint from being an open faucet.
[vars]
ALLOWED_ORIGINS = "https://vinighub.github.io,http://localhost:5173"

# TURN_KEY_ID and TURN_KEY_API_TOKEN are NOT set here: they are secrets, and
# this file is committed. Set them once with:
#
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
#
# The argument is the secret's NAME, always literal — those two names are what
# index.js reads off `env`. The value belongs in the prompt that follows.
# Passing the value as the argument creates a secret *named* after your token,
# in the clear and visible in the dashboard forever.
